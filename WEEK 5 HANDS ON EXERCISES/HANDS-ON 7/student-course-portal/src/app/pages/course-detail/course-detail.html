<h2>Course Details</h2>

<div *ngIf="course">

  <h3>{{ course.name }}</h3>

  <p>
    <strong>ID:</strong>
    {{ course.id }}
  </p>

  <p>
    <strong>Instructor:</strong>
    {{ course.instructor }}
  </p>

  <p>
    <strong>Duration:</strong>
    {{ course.duration }}
  </p>

</div>
